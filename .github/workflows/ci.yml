name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  ai-worker:
    name: AI Worker / test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-worker/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check app tests
      - run: python -m mypy app

  career-runner:
    name: Career Runner / test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/career-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/career-runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  core-api:
    name: Core API / integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  compose:
    name: Docker Compose / static config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  fullstack:
    name: Real API / isolated browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python -m pip install -r services/ai-worker/requirements.txt
      - run: chmod +x services/core-api/mvnw
      - run: services/core-api/mvnw -f services/core-api/pom.xml --batch-mode --no-transfer-progress package -DskipTests
      - run: node scripts/fullstack-qa.mjs
        env:
          PLAYWRIGHT_BROWSER_PATH: /usr/bin/google-chrome

  postgres:
    name: PostgreSQL schema and transaction tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerlens_test
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U careerlens -d careerlens_test" --health-interval=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x services/core-api/mvnw
      - run: >
          services/core-api/mvnw -f services/core-api/pom.xml --batch-mode --no-transfer-progress test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/careerlens_test
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=careerlens
          -Dspring.datasource.password=ci_test_only
          -Dspring.jpa.hibernate.ddl-auto=validate
