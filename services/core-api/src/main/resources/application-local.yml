spring:
  datasource:
    url: jdbc:h2:file:./data/careerlens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

careerlens:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
