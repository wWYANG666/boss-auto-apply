spring:
  datasource:
    url: jdbc:h2:mem:careerlens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

careerlens:
  legacy-resume-optimization:
    enabled: true
  dispatcher:
    enabled: false
  demo-data:
    enabled: false
  ai-worker:
    base-url: http://127.0.0.1:1
    timeout-seconds: 1
